# Copy to <agent workspace>/telegram.toml. Enforced by the server, not by the model.
# The server refuses to start if anyone but you can modify this file or its directory.
#
# [[chats]] is the complete list of chats this agent can see: every tool (history, search, unread,
# mentions, poll_new) is limited to them. send = true additionally allows send_message to that chat
# (which still needs TELEGRAM_MCP_ALLOW_SEND=1, a preview, and your approval).
# Find ids with list_chats in any Claude session outside an agent workspace.

# Appended by the server to every sent message; the model cannot remove it.
signature = "🤖 AI-generated reply, reviewed and sent by me"
max_sends_per_hour = 10

[[chats]]
chat = "@alice_example"        # @username or numeric id
note = "Alice, backend developer"
send = true

[[chats]]
chat = -1001234567890          # groups/channels: use the numeric id from list_chats
note = "Dev team: managers and developers"
send = false
